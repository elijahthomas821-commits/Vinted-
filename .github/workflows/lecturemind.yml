name: LectureMind

on:
  push:
    paths:
      - "LectureMind/**"
      - ".github/workflows/lecturemind.yml"
  pull_request:
    paths:
      - "LectureMind/**"
      - ".github/workflows/lecturemind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 ships Xcode 15.x (Swift 5.10), macos-15 ships Xcode 16.x (Swift 6).
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: LectureMind
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build (Debug)
        run: |
          xcodebuild -scheme LectureMind -configuration Debug build 2>&1 | tee build.log
          echo "Swift warnings in LectureMind sources:"
          grep -E "LectureMind/[A-Za-z]+\.swift:[0-9]+:[0-9]+: warning" build.log | sort -u || echo "none"

      - name: Unit tests
        run: xcodebuild -scheme LectureMind -configuration Debug -destination 'platform=macOS' test
